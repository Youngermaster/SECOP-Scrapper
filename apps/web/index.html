<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="SECOP Radar — buscador local de oportunidades de contratación pública en Colombia (SECOP II)."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SECOP Radar</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('secop-radar.settings');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
